services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ce-avocat-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - proxy

  db:
    image: postgres:16-alpine
    container_name: ce-avocat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    name: ce_avocat_internal
    driver: bridge
  proxy:
    external: true
    name: proxy

volumes:
  postgres_data:
    name: ce_avocat_postgres_data
